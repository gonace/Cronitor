name: Tests

permissions:
  contents: read

on:
  # Trigger the workflow on push or pull request,
  # but only for the main branch
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  tests:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          10.0.x
          9.0.x
          8.0.x
    - run: dotnet restore
    - run: dotnet build --no-restore --configuration Release
    - run: dotnet test --no-build --configuration Release --verbosity normal
    # Cronitor.TickerQ is built for one TickerQ major at a time; the solution covers TickerQ 10.
    - run: dotnet test Cronitor.TickerQ.Tests --configuration Release --verbosity normal -p:TickerQMajor=9
    - run: dotnet test Cronitor.TickerQ.Tests --configuration Release --verbosity normal -p:TickerQMajor=8
