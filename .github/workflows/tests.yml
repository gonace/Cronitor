name: Tests

permissions:
  contents: read

on:
  # Trigger the workflow on push or pull request,
  # but only for the main branch
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  tests:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          10.0.x
          9.0.x
          8.0.x
    - run: dotnet restore
    - run: dotnet build --no-restore --configuration Release
    # Each test run writes an xUnit TRX file, named by its own timestamp, to TestResults for the report below.
    - run: dotnet test --no-build --configuration Release --verbosity normal --report-xunit-trx --results-directory TestResults
    # Cronitor.TickerQ is built for one TickerQ major at a time; the solution covers TickerQ 10.
    - run: dotnet test Cronitor.TickerQ.Tests --configuration Release --verbosity normal -p:TickerQMajor=9 --report-xunit-trx --results-directory TestResults
    - run: dotnet test Cronitor.TickerQ.Tests --configuration Release --verbosity normal -p:TickerQMajor=8 --report-xunit-trx --results-directory TestResults
    # Cronitor.Quartz is built for one Quartz major at a time; the solution covers Quartz 3.
    - run: dotnet test Cronitor.Quartz.Tests --configuration Release --verbosity normal -p:QuartzMajor=4 --report-xunit-trx --results-directory TestResults
    # Writes the report to the job summary, the action's default, which needs no write permission.
    - uses: dorny/test-reporter@v2.1.1
      if: ${{ !cancelled() }}
      with:
        name: Test results
        path: TestResults/*.trx
        reporter: dotnet-trx
