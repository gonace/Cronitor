name: Publish

permissions:
  contents: read

on:
  workflow_dispatch: {}

jobs:
  tests:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          10.0.x
          9.0.x
          8.0.x
    - run: dotnet restore
    - run: dotnet build --no-restore --configuration Release
    - run: dotnet test --no-build --configuration Release --verbosity normal

  tag:
    runs-on: ubuntu-latest
    needs: tests

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
      - name: Tag branch
        run: |
          git config --local user.email "cronitor@gonace.com"
          git config --local user.name "Cronitor GitHub Action"
          git tag -f -a "v${{vars.VERSION}}.${{github.run_number}}" -m "Release v${{vars.VERSION}}.${{github.run_number}}"
          git push -f origin "v${{vars.VERSION}}.${{github.run_number}}"


  publish:
    runs-on: ubuntu-latest
    needs: tag

    permissions:
      contents: read
      id-token: write

    env:
      NUGET_SOURCE: https://api.nuget.org/v3/index.json

    steps:
    - name: Check out
      uses: actions/checkout@v7

    - name: Set up .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Set package versions
      env:
        VERSION: ${{vars.VERSION}}
        RUN: ${{github.run_number}}
      run: |
        echo "CRONITOR_VERSION=$VERSION.$RUN" >> "$GITHUB_ENV"
        echo "RELEASE_RUN=$RUN" >> "$GITHUB_ENV"

    # The extensions take their version from their project files; read it for the push steps.
    - name: Read extension versions
      run: |
        echo "QUARTZ_EXTENSIONS_VERSION=$(dotnet msbuild Quartz.Extensions.Cronitor/Quartz.Extensions.Cronitor.csproj -getProperty:Version -p:ReleaseRun=$RELEASE_RUN)" >> "$GITHUB_ENV"

    - name: Restore
      run: dotnet restore

    # Build and pack every package first, so nothing is pushed unless all of them are ready.
    - name: Build Cronitor
      run: |
        dotnet build Cronitor/Cronitor.csproj \
          --configuration Release \
          -p:CronitorVersion=$CRONITOR_VERSION

    - name: Pack Cronitor
      run: |
        dotnet pack Cronitor/Cronitor.csproj \
          --configuration Release \
          --no-build \
          -p:CronitorVersion=$CRONITOR_VERSION \
          -p:NuspecFile=Cronitor.nuspec \
          -p:IncludeSymbols=true \
          -p:SymbolPackageFormat=snupkg

    - name: Build Quartz.Extensions.Cronitor
      run: |
        dotnet build Quartz.Extensions.Cronitor/Quartz.Extensions.Cronitor.csproj \
          --configuration Release \
          -p:CronitorVersion=$CRONITOR_VERSION \
          -p:ReleaseRun=$RELEASE_RUN

    - name: Pack Quartz.Extensions.Cronitor
      run: |
        dotnet pack Quartz.Extensions.Cronitor/Quartz.Extensions.Cronitor.csproj \
          --configuration Release \
          --no-build \
          -p:CronitorVersion=$CRONITOR_VERSION \
          -p:ReleaseRun=$RELEASE_RUN \
          -p:IncludeSymbols=true \
          -p:SymbolPackageFormat=snupkg

    # One short-lived key from nuget.org's trusted publishing, valid for an hour, pushes every package.
    - name: Log in to NuGet
      id: login
      uses: NuGet/login@v1
      with:
        user: ${{secrets.NUGET_USER}}

    - name: Push Cronitor
      env:
        NUGET_API_KEY: ${{steps.login.outputs.NUGET_API_KEY}}
      run: |
        dotnet nuget push Cronitor/bin/Release/Cronitor.$CRONITOR_VERSION.nupkg \
          --api-key "$NUGET_API_KEY" \
          --source "$NUGET_SOURCE" \
          --skip-duplicate

    - name: Push Quartz.Extensions.Cronitor
      env:
        NUGET_API_KEY: ${{steps.login.outputs.NUGET_API_KEY}}
      run: |
        dotnet nuget push Quartz.Extensions.Cronitor/bin/Release/Quartz.Extensions.Cronitor.$QUARTZ_EXTENSIONS_VERSION.nupkg \
          --api-key "$NUGET_API_KEY" \
          --source "$NUGET_SOURCE" \
          --skip-duplicate
