name: Publish

permissions:
  contents: read

on:
  workflow_dispatch: {}

jobs:
  tests:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          10.0.x
          9.0.x
          8.0.x
    - run: dotnet restore
    - run: dotnet build --no-restore --configuration Release
    # Each test run writes an xUnit TRX file, named by its own timestamp, to TestResults for the report below.
    - run: dotnet test --no-build --configuration Release --verbosity normal --report-xunit-trx --results-directory TestResults
    # Cronitor.TickerQ is built for one TickerQ major at a time; the solution covers TickerQ 10.
    - run: dotnet test Cronitor.TickerQ.Tests --configuration Release --verbosity normal -p:TickerQMajor=9 --report-xunit-trx --results-directory TestResults
    - run: dotnet test Cronitor.TickerQ.Tests --configuration Release --verbosity normal -p:TickerQMajor=8 --report-xunit-trx --results-directory TestResults
    # Cronitor.Quartz is built for one Quartz major at a time; the solution covers Quartz 3.
    - run: dotnet test Cronitor.Quartz.Tests --configuration Release --verbosity normal -p:QuartzMajor=4 --report-xunit-trx --results-directory TestResults
    # Writes the report to the job summary, the action's default, which needs no write permission.
    - uses: dorny/test-reporter@v2.1.1
      if: ${{ !cancelled() }}
      with:
        name: Test results
        path: TestResults/*.trx
        reporter: dotnet-trx

  tag:
    runs-on: ubuntu-latest
    needs: tests

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
      - name: Tag branch
        run: |
          git config --local user.email "cronitor@gonace.com"
          git config --local user.name "Cronitor GitHub Action"
          git tag -f -a "v${{vars.VERSION}}.${{github.run_number}}" -m "Release v${{vars.VERSION}}.${{github.run_number}}"
          git push -f origin "v${{vars.VERSION}}.${{github.run_number}}"


  publish:
    runs-on: ubuntu-latest
    needs: tag

    permissions:
      contents: read
      id-token: write

    env:
      NUGET_SOURCE: https://api.nuget.org/v3/index.json

    steps:
    - name: Check out
      uses: actions/checkout@v7

    - name: Set up .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Set package versions
      env:
        VERSION: ${{vars.VERSION}}
        RUN: ${{github.run_number}}
      run: |
        echo "CRONITOR_VERSION=$VERSION.$RUN" >> "$GITHUB_ENV"
        echo "RELEASE_RUN=$RUN" >> "$GITHUB_ENV"

    # The extensions take their version from their project files; read it for the push steps.
    - name: Read extension versions
      run: |
        echo "CRONITOR_QUARTZ_VERSION=$(dotnet msbuild Cronitor.Quartz/Cronitor.Quartz.csproj -getProperty:Version -p:ReleaseRun=$RELEASE_RUN)" >> "$GITHUB_ENV"
        echo "CRONITOR_QUARTZ_4_VERSION=$(dotnet msbuild Cronitor.Quartz/Cronitor.Quartz.csproj -getProperty:Version -p:ReleaseRun=$RELEASE_RUN -p:QuartzMajor=4)" >> "$GITHUB_ENV"
        echo "CRONITOR_HANGFIRE_VERSION=$(dotnet msbuild Cronitor.Hangfire/Cronitor.Hangfire.csproj -getProperty:Version -p:ReleaseRun=$RELEASE_RUN)" >> "$GITHUB_ENV"
        echo "CRONITOR_TICKERQ_VERSION=$(dotnet msbuild Cronitor.TickerQ/Cronitor.TickerQ.csproj -getProperty:Version -p:ReleaseRun=$RELEASE_RUN)" >> "$GITHUB_ENV"
        echo "CRONITOR_TICKERQ_9_VERSION=$(dotnet msbuild Cronitor.TickerQ/Cronitor.TickerQ.csproj -getProperty:Version -p:ReleaseRun=$RELEASE_RUN -p:TickerQMajor=9)" >> "$GITHUB_ENV"
        echo "CRONITOR_TICKERQ_8_VERSION=$(dotnet msbuild Cronitor.TickerQ/Cronitor.TickerQ.csproj -getProperty:Version -p:ReleaseRun=$RELEASE_RUN -p:TickerQMajor=8)" >> "$GITHUB_ENV"

    - name: Restore
      run: dotnet restore

    # Build and pack every package first, so nothing is pushed unless all of them are ready.
    - name: Build Cronitor
      run: |
        dotnet build Cronitor/Cronitor.csproj \
          --configuration Release \
          -p:CronitorVersion=$CRONITOR_VERSION

    - name: Pack Cronitor
      run: |
        dotnet pack Cronitor/Cronitor.csproj \
          --configuration Release \
          --no-build \
          -p:CronitorVersion=$CRONITOR_VERSION \
          -p:IncludeSymbols=true \
          -p:SymbolPackageFormat=snupkg

    - name: Build Cronitor.Quartz
      run: |
        dotnet build Cronitor.Quartz/Cronitor.Quartz.csproj \
          --configuration Release \
          -p:CronitorVersion=$CRONITOR_VERSION \
          -p:ReleaseRun=$RELEASE_RUN

    - name: Pack Cronitor.Quartz
      run: |
        dotnet pack Cronitor.Quartz/Cronitor.Quartz.csproj \
          --configuration Release \
          --no-build \
          -p:CronitorVersion=$CRONITOR_VERSION \
          -p:ReleaseRun=$RELEASE_RUN \
          -p:IncludeSymbols=true \
          -p:SymbolPackageFormat=snupkg
    # The same project again for Quartz 4, its own version line. Building restores for that major.
    - name: Build and pack Cronitor.Quartz for Quartz 4
      run: |
        dotnet build Cronitor.Quartz/Cronitor.Quartz.csproj \
          --configuration Release \
          -p:CronitorVersion=$CRONITOR_VERSION \
          -p:ReleaseRun=$RELEASE_RUN \
          -p:QuartzMajor=4
        dotnet pack Cronitor.Quartz/Cronitor.Quartz.csproj \
          --configuration Release \
          --no-build \
          -p:CronitorVersion=$CRONITOR_VERSION \
          -p:ReleaseRun=$RELEASE_RUN \
          -p:QuartzMajor=4 \
          -p:IncludeSymbols=true \
          -p:SymbolPackageFormat=snupkg

    - name: Build Cronitor.Hangfire
      run: |
        dotnet build Cronitor.Hangfire/Cronitor.Hangfire.csproj \
          --configuration Release \
          -p:CronitorVersion=$CRONITOR_VERSION \
          -p:ReleaseRun=$RELEASE_RUN

    - name: Pack Cronitor.Hangfire
      run: |
        dotnet pack Cronitor.Hangfire/Cronitor.Hangfire.csproj \
          --configuration Release \
          --no-build \
          -p:CronitorVersion=$CRONITOR_VERSION \
          -p:ReleaseRun=$RELEASE_RUN \
          -p:IncludeSymbols=true \
          -p:SymbolPackageFormat=snupkg

    - name: Build Cronitor.TickerQ
      run: |
        dotnet build Cronitor.TickerQ/Cronitor.TickerQ.csproj \
          --configuration Release \
          -p:CronitorVersion=$CRONITOR_VERSION \
          -p:ReleaseRun=$RELEASE_RUN

    - name: Pack Cronitor.TickerQ
      run: |
        dotnet pack Cronitor.TickerQ/Cronitor.TickerQ.csproj \
          --configuration Release \
          --no-build \
          -p:CronitorVersion=$CRONITOR_VERSION \
          -p:ReleaseRun=$RELEASE_RUN \
          -p:IncludeSymbols=true \
          -p:SymbolPackageFormat=snupkg

    # The same project again for TickerQ 9 and 8, each its own version line. Building restores for that major.
    - name: Build and pack Cronitor.TickerQ for TickerQ 9 and 8
      run: |
        for major in 9 8; do
          dotnet build Cronitor.TickerQ/Cronitor.TickerQ.csproj \
            --configuration Release \
            -p:CronitorVersion=$CRONITOR_VERSION \
            -p:ReleaseRun=$RELEASE_RUN \
            -p:TickerQMajor=$major
          dotnet pack Cronitor.TickerQ/Cronitor.TickerQ.csproj \
            --configuration Release \
            --no-build \
            -p:CronitorVersion=$CRONITOR_VERSION \
            -p:ReleaseRun=$RELEASE_RUN \
            -p:TickerQMajor=$major \
            -p:IncludeSymbols=true \
            -p:SymbolPackageFormat=snupkg
        done

    # One short-lived key from nuget.org's trusted publishing, valid for an hour, pushes every package.
    - name: Log in to NuGet
      id: login
      uses: NuGet/login@v1
      with:
        user: ${{secrets.NUGET_USER}}

    - name: Push Cronitor
      env:
        NUGET_API_KEY: ${{steps.login.outputs.NUGET_API_KEY}}
      run: |
        dotnet nuget push Cronitor/bin/Release/Cronitor.$CRONITOR_VERSION.nupkg \
          --api-key "$NUGET_API_KEY" \
          --source "$NUGET_SOURCE"

    - name: Push Cronitor.Quartz
      env:
        NUGET_API_KEY: ${{steps.login.outputs.NUGET_API_KEY}}
      run: |
        dotnet nuget push Cronitor.Quartz/bin/Release/Cronitor.Quartz.$CRONITOR_QUARTZ_VERSION.nupkg \
          --api-key "$NUGET_API_KEY" \
          --source "$NUGET_SOURCE"
        dotnet nuget push Cronitor.Quartz/bin/Release/Cronitor.Quartz.$CRONITOR_QUARTZ_4_VERSION.nupkg \
          --api-key "$NUGET_API_KEY" \
          --source "$NUGET_SOURCE"

    - name: Push Cronitor.Hangfire
      env:
        NUGET_API_KEY: ${{steps.login.outputs.NUGET_API_KEY}}
      run: |
        dotnet nuget push Cronitor.Hangfire/bin/Release/Cronitor.Hangfire.$CRONITOR_HANGFIRE_VERSION.nupkg \
          --api-key "$NUGET_API_KEY" \
          --source "$NUGET_SOURCE"

    - name: Push Cronitor.TickerQ
      env:
        NUGET_API_KEY: ${{steps.login.outputs.NUGET_API_KEY}}
      run: |
        dotnet nuget push Cronitor.TickerQ/bin/Release/Cronitor.TickerQ.$CRONITOR_TICKERQ_VERSION.nupkg \
          --api-key "$NUGET_API_KEY" \
          --source "$NUGET_SOURCE"
        dotnet nuget push Cronitor.TickerQ/bin/Release/Cronitor.TickerQ.$CRONITOR_TICKERQ_9_VERSION.nupkg \
          --api-key "$NUGET_API_KEY" \
          --source "$NUGET_SOURCE"
        dotnet nuget push Cronitor.TickerQ/bin/Release/Cronitor.TickerQ.$CRONITOR_TICKERQ_8_VERSION.nupkg \
          --api-key "$NUGET_API_KEY" \
          --source "$NUGET_SOURCE"
